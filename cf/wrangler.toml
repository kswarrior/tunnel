name = "cf-hello-world"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Frontend built by `npm run build` (Vite) into ./dist.
# Deploy with: npx wrangler deploy
# NOTE: run `npm run build` before deploy, or set dashboard
# Build command to `npm install && npm run build`.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
