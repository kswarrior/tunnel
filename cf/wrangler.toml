name = "tunnel"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Frontend built by `npm run build` (Vite) into ./dist.
# Deploy with: npx wrangler deploy (run inside cf/, or from repo root via npm run deploy).
# The [build] step below makes `wrangler deploy` build ./dist automatically.
# IMPORTANT: In Cloudflare dashboard set Root directory = cf
#   Build command = npm run build
#   Deploy command = npx wrangler deploy
# If Root directory = / (repo root), use Build = npm --prefix cf run build
# and Deploy = npx wrangler deploy --config cf/wrangler.toml
[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# Must cover both raw and percent-encoded forms:
#   /!tunnel=ks  -> path contains "=" (not a "/"), so "/!tunnel/*" alone doesn't match.
#   /!tunnel%3Dks and /%21tunnel%3Dks are what some browsers/CDNs send when they encode.
# Use prefix wildcards ("/!tunnel*") so the Worker runs first and can proxy or redirect.
# Note: wrangler errors on redundant patterns, so just the two wildcards cover all variants.
run_worker_first = ["/api", "/api/*", "/!tunnel*", "/%21tunnel*", "/v", "/v/*", "/v1", "/v1/*"]

[durable_objects]
bindings = [
  { name = "HOST_PRESENCE", class_name = "HostPresence" },
  { name = "TUNNEL_REGISTRY", class_name = "TunnelRegistry" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostPresence"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TunnelRegistry"]

[dev]
port = 8080
