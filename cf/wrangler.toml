name = "tunnel"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Frontend built by `npm run build` (Vite) into ./dist.
# Deploy with: npx wrangler deploy
# The [build] step below makes `wrangler deploy` / `wrangler dev` run
# `npm run build` automatically, so Cloudflare Builds works even when the
# dashboard Deploy command is just `npx wrangler deploy` (no separate
# Build command needed — Cloudflare already runs `npm clean-install`).
[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/!tunnel", "/!tunnel/*", "/v", "/v/*", "/v1", "/v1/*"]

[durable_objects]
bindings = [
  { name = "HOST_PRESENCE", class_name = "HostPresence" },
  { name = "TUNNEL_REGISTRY", class_name = "TunnelRegistry" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostPresence"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TunnelRegistry"]
